              - paragraph [ref=e304]: "The following common features are available as well:"
              - table [ref=e305]:
                - rowgroup [ref=e309]:
                  - row [ref=e310]:
                    - rowheader [ref=e311]:
                      - paragraph [ref=e312]: Self-Service Instance Provisioning and Configuration
                    - cell [ref=e313]:
                      - paragraph [ref=e314]: Service instances can be self-service ordered and are provisioned fully automated in the background. Access to self-service provisioning is provided via custom Kubernetes configuration objects in the Kubernetes cluster or via Open Service Broker API (on request).
                  - row [ref=e315]:
                    - rowheader [ref=e316]:
                      - paragraph [ref=e317]: Best-Practice Configuration Management
                    - cell [ref=e318]:
                      - paragraph [ref=e319]: Services are configured with best practices and the configuration is updated continuously as we learn improvements during day-2 operations and from the community. Industry standards are used for security configuration and wherever possible TLS encrypted connections are offered by default.
                  - row [ref=e320]:
                    - rowheader [ref=e321]:
                      - paragraph [ref=e322]: Maintenance and Security Operations
                    - cell [ref=e323]:
                      - paragraph [ref=e324]: Patch updates are applied as they get available. We monitor security information for services and apply zero-day patches or workaround configuration as they become available.
                  - row [ref=e325]:
                    - rowheader [ref=e326]:
                      - paragraph [ref=e327]: Data Protection and Recovery
                    - cell [ref=e328]:
                      - paragraph [ref=e329]: All services offer regular backup and deletion protection options. See the service descriptions for more details.
                  - row [ref=e330]:
                    - rowheader [ref=e331]:
                      - paragraph [ref=e332]: Service Metrics
                    - cell [ref=e333]:
                      - paragraph [ref=e334]:
                        - text: Performance metrics are collected regularly. The metrics are automatically monitored and acted upon irregularities, see
                        - emphasis [ref=e335]: Monitoring and Alerting
                        - text: below.
                  - row [ref=e336]:
                    - rowheader [ref=e337]:
                      - paragraph [ref=e338]: Monitoring and Alerting
                    - cell [ref=e339]:
                      - paragraph [ref=e340]:
                        - text: Service Level Indicators are monitored and alerted upon. Depending on the
                        - link "service level" [ref=e341] [cursor=pointer]:
                          - /url: ../service_levels.html
                        - text: alerts are handled by a VSHNeer. User alerting is highly encouraged. See the service descriptions for more details.
                  - row [ref=e342]:
                    - rowheader [ref=e343]:
                      - paragraph [ref=e344]: Service Logging
                    - cell [ref=e345]:
                      - paragraph [ref=e346]: All logs are collected and are available to debug service errors.
                  - row [ref=e347]:
                    - rowheader [ref=e348]:
                      - paragraph [ref=e349]: Support by VSHN or Partner
                    - cell [ref=e350]:
                      - paragraph [ref=e351]:
                        - text: Support from VSHN is available at additional cost via
                        - link "Support Plans 🔗" [ref=e352] [cursor=pointer]:
                          - /url: https://products.vshn.ch/support_plans.html
                        - text: . Depending on the service, additional support by the software partner or a third-party might be available at additional cost.
          - generic [ref=e353]:
