              - definition [ref=e616]:
                - paragraph [ref=e617]:
                  - text: Our
                  - link "Codey" [ref=e618] [cursor=pointer]:
                    - /url: ../codey.html
                  - text: service is a full self-service SaaS offering, which includes the compute resources. It’s "batteries included", you cannot choose on which OpenShift or Kubernetes cluster Codey runs, whereas with the "Forgejo by VSHN" application catalog service, you can have it running on your own cluster. You also have more configuration options with the application catalog service and are not tied to the Codey plans.
