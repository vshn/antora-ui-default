            - generic [ref=e355]:
              - paragraph [ref=e357]: "Support for Forgejo is organized in three levels:"
              - generic [ref=e359]:
                - term [ref=e360]: "Level 1: End-User Support"
                - definition [ref=e361]:
                  - paragraph [ref=e362]: Helping users with the daily use of Forgejo is the customer’s concern. End-user support isn’t included in this service.
                - term [ref=e363]: "Level 2: Operations Support"
                - definition [ref=e364]:
                  - paragraph [ref=e365]:
                    - text: VSHN provides support concerning the operations of Forgejo and the database. Our
                    - link "Support Plans" [ref=e366] [cursor=pointer]:
                      - /url: ../support_plans.html
                    - text: describes in detail what VSHN offers in terms of support.
                - term [ref=e367]: "Level 3: Application Support"
