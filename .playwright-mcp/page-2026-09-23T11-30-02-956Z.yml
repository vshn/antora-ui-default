            - heading "Recurring Maintenance" [level=2] [ref=e398]
            - generic [ref=e399]:
              - paragraph [ref=e401]: We conduct recurring maintenance tasks on the service to keep it stable and up-to-date.
              - generic [ref=e403]:
                - term [ref=e404]: Planned Maintenance Activities
                - definition [ref=e405]:
                  - list [ref=e407]:
                    - listitem [ref=e408]:
                      - paragraph [ref=e409]: Updating of the base container image with the latest patched version, this causes a service restart.
                    - listitem [ref=e410]:
                      - paragraph [ref=e411]: If there’s a newer minor version available that does not contain breaking changes, then the service will automatically be updated to that minor version.
                    - listitem [ref=e412]:
                      - paragraph [ref=e413]: Major upgrades are not automatic.
                    - listitem [ref=e414]:
                      - paragraph [ref=e415]: Configuration improvements as we learn new best-practices or some configuration proved to be non-optimal.
                - term [ref=e416]: Mandatory Maintenance Activities
                - definition [ref=e417]:
                  - list [ref=e419]:
                    - listitem [ref=e420]:
                      - paragraph [ref=e421]: Security issue (CVE) mitigation by updating to a patched version or configuration adjustments, usually causes service restart.
                    - listitem [ref=e422]:
                      - paragraph [ref=e423]: Regular maintenance on the underlying platform, usually causing up to 2 restarts per replica.
                - term [ref=e424]: Maintenance Windows
                - definition [ref=e425]:
                  - paragraph [ref=e426]: This is an automated recurrence once a week. The day and time can be configured per service instance, whereas by default it is a random time in the night from Tuesday to Wednesday.
          - generic [ref=e427]:
