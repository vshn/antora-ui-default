                  - text: . Once you have access to such a cluster, it’s a matter of creating a Kubernetes object to order a service instance. In the
                  - link "getting started guide 🔗" [ref=e580] [cursor=pointer]:
                    - /url: https://docs.appcat.ch/getting-started.html
                  - text: you’ll find all the information you need to get started.
              - term [ref=e581]: Where do I get it?
              - definition [ref=e582]:
                - paragraph [ref=e583]:
                  - text: As mentioned in the previous answer, the service is available on
                  - link "APPUiO" [ref=e584] [cursor=pointer]:
