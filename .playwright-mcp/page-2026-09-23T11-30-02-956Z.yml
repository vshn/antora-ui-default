            - generic [ref=e157]:
              - blockquote [ref=e158]:
                - paragraph [ref=e160]: Forgejo is a self-hosted lightweight software forge. Easy to install and low maintenance, it just does the job.
              - generic [ref=e161]: — Forgejo Website
            - paragraph [ref=e163]: "Our service offers a compelling solution for businesses seeking secure and efficient code hosting. Based in Switzerland, our service provides several key advantages:"
            - generic [ref=e165]:
              - term [ref=e166]: Switzerland Based
              - definition [ref=e167]:
                - paragraph [ref=e168]: Hosting your Forgejo service by a company based in Switzerland ensures data privacy, security, and compliance with strict Swiss regulations.
              - term [ref=e169]: Unrestricted Access to Forgejo Features
              - definition [ref=e170]:
                - paragraph [ref=e171]: With our service, you have access to the full range of Forgejo’s features, ensuring you can tailor your code hosting needs to your specific needs.
              - term [ref=e172]: Simple Price Model
              - definition [ref=e173]:
                - paragraph [ref=e174]: We offer a straightforward pricing model, making it easy for you to budget and plan for your code hosting needs without hidden costs or surprises.
              - term [ref=e175]: SLA Available
              - definition [ref=e176]:
                - paragraph [ref=e177]: For added peace of mind, we offer Service Level Agreements (SLAs) that guarantee the reliability and availability of your Forgejo service.
              - term [ref=e178]: Run by Experts Running Software
              - definition [ref=e179]:
                - paragraph [ref=e180]: Our service is managed by a team of experts with a proven track record of running complex software systems, ensuring that your Forgejo service is in capable hands.
            - paragraph [ref=e182]: In summary, our service provides a secure, feature-rich, and hassle-free solution for code hosting, all while benefiting from Switzerland’s robust data protection laws and the expertise of DevOps professionals.
