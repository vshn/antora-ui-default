                  - text: and we’ll help you get started.
              - term [ref=e607]: How can I get support?
              - definition [ref=e608]:
                - paragraph [ref=e609]:
                  - text: You can either open a ticket on our
                  - link "customer portal" [ref=e610] [cursor=pointer]:
