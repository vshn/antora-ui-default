                  - text: and
                  - link "Managed OpenShift" [ref=e585] [cursor=pointer]:
                    - /url: ../openshift/index.html
                  - text: .
              - term [ref=e586]: Are there any extra costs?
              - definition [ref=e587]:
                - paragraph [ref=e588]:
                  - text: Yes, there are usage costs associated with the service. Please refer to
                  - link "VSHN AppCat Services Pricing" [ref=e589] [cursor=pointer]:
                    - /url: pricing.html
                  - text: for further information.
              - term [ref=e590]: Who will set it up?
              - definition [ref=e591]:
                - paragraph [ref=e592]: All services are available in full self-service. There is no need to open a ticket and wait until the service is provisioned, it’s available immediately.
              - term [ref=e593]: What do I need to do?
              - definition [ref=e594]:
                - paragraph [ref=e595]:
                  - text: The
                  - link "user documentation 🔗" [ref=e596] [cursor=pointer]:
                    - /url: https://docs.appcat.ch/
                  - text: explains everything you need to know.
              - term [ref=e597]: Can I get it myself or do I need to contact anyone?
              - definition [ref=e598]:
                - paragraph [ref=e599]:
                  - text: There is no need to contact anyone, just follow the instructions on
                  - link "docs.appcat.ch 🔗" [ref=e600] [cursor=pointer]:
                    - /url: https://docs.appcat.ch/
                  - text: and you’ll be up and running in no time.
              - term [ref=e601]: How can it be integrated in my environment?
              - definition [ref=e602]:
                - paragraph [ref=e603]:
                  - text: Services are available right now on
                  - link "APPUiO" [ref=e604] [cursor=pointer]:
                    - /url: ../appuio/index.html
                  - text: and
                  - link "Managed OpenShift" [ref=e605] [cursor=pointer]:
                    - /url: ../openshift/index.html
                  - text: . If you want these services on your environment, please
                  - link "contact us 🔗" [ref=e606] [cursor=pointer]:
